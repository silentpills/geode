site_name: GeoDE
site_description: Geodesy Database Engine - Python framework for automated GNSS data processing
repo_url: https://github.com/silentpills/geode

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy

plugins:
  - search

nav:
  - Home: index.md
  - Installation:
    - Overview: installation/index.md
    - Database Setup: installation/database-setup.md
    - Web Interface: installation/web-interface.md
    - CLI Tools: installation/cli-tools.md
  - Usage:
    - CLI Reference: usage/cli-reference.md
    - Reports and Campaigns: usage/reports-and-campaigns.md
    - Web Interface: usage/web-interface.md
  - Reference:
    - Configuration: reference/configuration.md
  - Development:
    - Contributing: development/contributing.md
    - Upstream Integration: development/upstream-integration.md

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
