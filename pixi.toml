[workspace]
requires-pixi = ">=0.80,<0.81"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
python = ">=3.13,<3.14"
cartopy = "*"
geopandas = "*"
geopy = "*"
h5py = "*"
matplotlib = "*"
networkx = "*"
numpy = ">=1.19.5"
pandas = "*"
paramiko = "*"
psycopg = "*"
scikit-learn = ">=1.1"
scipy = "*"
tqdm = "*"
xmltodict = "*"
scikit-image = "*"
shapely = "*"
obspy = "*"

[feature.dev.dependencies]
pytest = "*"
pytest-cov = "*"
ruff = "*"
pip = "*"
# Type stubs for better IDE support and type checking
types-tqdm = "*"
types-requests = "*"
types-paramiko = "*"
# psycopg (v3) ships with inline type annotations (py.typed), no stub needed
types-setuptools = "*"
postgresql = ">=18.4,<19"

[feature.dev.pypi-dependencies]
# Type checker (using ty by Astral - makers of ruff and uv)
ty = "*"

# Git hooks framework for running checks before commits
pre-commit = "*"

# Better commit messages (conventional commits)
commitizen = "*"

[pypi-dependencies]
geode-gnss = { path = ".", editable = true }
country-converter = "*"
dirsync = "*"
dispy = "*"
earthscope-cli = "*"
earthscope-sdk = "*"
hdf5storage = "*"
munch = "*"
pycos = "*"
simplekml = "*"
usgs-libcomcat = "*"
legacy-cgi = ">=2.6.4, <3"
python-dotenv = ">=1.0.0"

[feature.reports.pypi-dependencies]
staticmap = ">=0.5.7"
weasyprint = ">=60.0"

[environments]
# Default environment includes dev features for local development
default = { features = ["dev"], solve-group = "default" }

# Docs environment for building documentation
docs = { features = ["docs"], solve-group = "default" }
reports = { features = ["dev", "reports"], solve-group = "default" }
web = { features = ["dev", "web"], solve-group = "default" }
runtime = { features = ["web"], solve-group = "default" }
frontend = { features = ["frontend"], no-default-feature = true }
audit = { features = ["audit"], no-default-feature = true }

[feature.docs.pypi-dependencies]
mkdocs = "*"
mkdocs-material = "*"
pymdown-extensions = "*"

[tasks]
# Testing
test = { cmd = "pytest" }
"test:api" = { cmd = "pytest geode/tests/test_antenna_api.py geode/tests/test_database_bootstrap.py" }
"test:verbose" = { cmd = "pytest -v" }
"test:cov" = { cmd = "pytest --cov=geode --cov-report=term-missing" }

# Linting and formatting
lint = { cmd = "ruff check geode com tools web/backend/api/management" }
"lint:fix" = { cmd = "ruff check --fix geode com tools web/backend/api/management" }
format = { cmd = "ruff format geode com tools web/backend/api/management" }
"format:check" = { cmd = "ruff format --check geode com tools web/backend/api/management" }

# Type checking
typecheck = { cmd = "ty check --output-format github geode com" }

# Documentation
"docs:serve" = { cmd = "mkdocs serve" }
"docs:build" = { cmd = "mkdocs build" }

# Pre-commit hooks
"precommit:install" = { cmd = "pre-commit install --install-hooks --hook-type pre-commit --hook-type commit-msg" }
"precommit:run" = { cmd = "pre-commit run --all-files" }

# All checks (useful for CI)
check = { cmd = "ruff check geode com tools web/backend/api/management && ruff format --check geode com tools web/backend/api/management && pytest" }
# Utilities
# check-external = "which gfzrnx && which crx2rnx && which gpspace && which sh_gamit"
# pgamit = "pgamit --help"
# plot = "PlotETM.py <sitecode>"

# Backend/API tests use the same Django and DRF series as the backend image.
[feature.web.pypi-dependencies]
django = "~=5.2.11"
djangorestframework = "~=3.17.2"
djangorestframework-simplejwt = "~=5.5.1"
django-auditlog = "==3.0.0"
django-filter = "==24.2"
django-cors-headers = "==4.3.1"
django-cleanup = "==8.1.0"
drf-spectacular = "==0.28.0"
drf-standardized-errors = "==0.13.0"
celery = "~=5.5.0"
redis = "~=5.2.0"

# Explicit backend runtime imports, shared by Docker and the web test environment.
gunicorn = ">=23,<24"
argon2-cffi = ">=23.1"
lxml = ">=5"

[feature.frontend.dependencies]
nodejs = "22.*"

[feature.frontend.tasks]
"frontend:install" = { cmd = "npm ci", cwd = "web/frontend" }
"frontend:build" = { cmd = "npm run build", cwd = "web/frontend", depends-on = ["frontend:install"] }
"frontend:lint" = { cmd = "npm run lint", cwd = "web/frontend", depends-on = ["frontend:install"] }

[feature.audit.dependencies]
python = ">=3.13,<3.14"

[feature.audit.pypi-dependencies]
pip-audit = ">=2.9,<3"

[feature.web.tasks]
"db:migrate" = "python web/backend/manage.py migrate --noinput"
"db:check" = "python web/backend/manage.py makemigrations --check --dry-run"
"admin:create" = "python web/backend/manage.py createadmin"
"doctor" = "python web/backend/manage.py doctor"
