name: Docker

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hadolint:
    name: Lint Dockerfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Lint backend Dockerfile
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: web/backend/Dockerfile

      - name: Lint frontend Dockerfile
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: web/frontend/Dockerfile

  build:
    name: Build, smoke-test and scan images
    runs-on: ubuntu-latest
    needs: hadolint
    env:
      COMPOSE_PROJECT_NAME: geode-ci
    steps:
      - uses: actions/checkout@v6

      - name: Smoke-test fresh deployment and readiness
        run: |
          umask 077
          cp .env.example .env
          for key in POSTGRES_PASSWORD POSTGRES_ADMIN_PASSWORD POSTGRES_APP_PASSWORD DJANGO_SECRET_KEY; do
            sed -i "s|^${key}=.*|${key}=$(openssl rand -hex 32)|" .env
          done
          sed -i "s/^USER_ID_TO_SAVE_FILES=.*/USER_ID_TO_SAVE_FILES=$(id -u)/;s/^GROUP_ID_TO_SAVE_FILES=.*/GROUP_ID_TO_SAVE_FILES=$(id -g)/" .env
          mkdir -p var/media
          docker compose --profile bundled-db up --build -d --wait --wait-timeout 300
          curl --fail http://localhost:8080/api/health-check
          curl --fail --head http://localhost:8080/
          docker compose exec -T frontend nginx -t
          docker compose exec -T backend python manage.py migrate --check
          docker compose exec -T backend python manage.py makemigrations --check --dry-run
          docker compose exec -T backend python manage.py shell -c 'from api.models import User; assert not User.objects.exists()'
          docker compose exec -T backend python manage.py doctor
          docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U geode_app -d pgamit -c "
            DO \$\$ BEGIN
              IF current_setting('is_superuser') != 'off' OR has_schema_privilege('public', 'CREATE')
                OR has_schema_privilege('geode_compute', 'USAGE')
                OR NOT has_table_privilege('api_user', 'INSERT')
              THEN RAISE EXCEPTION 'Incorrect application database privileges'; END IF;
            END \$\$;"
      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: geode-ci-backend
          format: table
          severity: HIGH,CRITICAL
          # Findings remain informational; scanner/setup errors fail the job.
          exit-code: '0'

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: geode-ci-frontend
          format: table
          severity: HIGH,CRITICAL
          # Findings remain informational; scanner/setup errors fail the job.
          exit-code: '0'

      - name: Show deployment logs
        if: always()
        run: docker compose --profile bundled-db logs --no-color
      - name: Stop smoke-test services
        if: always()
        run: docker compose --profile bundled-db down --volumes
