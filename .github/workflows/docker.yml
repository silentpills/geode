name: Docker

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  hadolint:
    name: Lint Dockerfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Lint backend Dockerfile
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: web/backend/Dockerfile

      - name: Lint frontend Dockerfile
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: web/frontend/Dockerfile

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: hadolint
    steps:
      - uses: actions/checkout@v6

      - name: Build backend image
        run: docker build -f web/backend/Dockerfile -t gnss-backend .

      - name: Build frontend image
        run: docker build -t gnss-frontend ./web/frontend


      - name: Smoke-test fresh deployment and readiness
        run: |
          cp .env.example .env
          mkdir -p var/media
          chmod 777 var/media
          docker compose --profile bundled-db up --build -d --wait --wait-timeout 300
          curl --fail http://localhost:8080/api/health-check
          curl --fail --head http://localhost:8080/
          docker compose exec -T frontend nginx -t
          docker compose exec -T backend python manage.py migrate --check
          docker compose exec -T backend python manage.py makemigrations --check --dry-run
          docker compose exec -T backend python manage.py shell -c 'from api.models import User; assert not User.objects.exists()'
      - name: Show deployment logs
        if: always()
        run: docker compose --profile bundled-db logs --no-color
      - name: Stop smoke-test services
        if: always()
        run: docker compose --profile bundled-db down --volumes

  trivy:
    name: Container Security Scan
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true  # Informational - base images often have CVEs we can't fix
    steps:
      - uses: actions/checkout@v6

      - name: Build backend image
        run: docker build -f web/backend/Dockerfile -t gnss-backend .

      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: gnss-backend
          format: table
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Build frontend image
        run: docker build -t gnss-frontend ./web/frontend


      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: gnss-frontend
          format: table
          severity: HIGH,CRITICAL
          exit-code: 1
