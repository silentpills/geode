version: 2
# Python updates must also refresh pixi.lock; CI rejects manifest/lock drift.
updates:
  # Python dependencies (pyproject.toml)
  - package-ecosystem: pip
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: ["dependencies"]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
    labels: ["dependencies"]

  # npm (frontend)
  - package-ecosystem: npm
    directory: "/web/frontend"
    target-branch: dev
    schedule:
      interval: weekly
    labels: ["dependencies"]

  # Docker (backend)
  - package-ecosystem: docker
    directory: "/web/backend"
    target-branch: dev
    schedule:
      interval: monthly
    labels: ["dependencies"]

  # Docker (frontend)
  - package-ecosystem: docker
    directory: "/web/frontend"
    target-branch: dev
    schedule:
      interval: monthly
    labels: ["dependencies"]
