# Run these same locked checks locally and in CI. Type checking remains manual
# until the existing repository-wide annotation backlog has been addressed.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff (Pixi lock)
        entry: pixi run --locked lint
        language: system
        pass_filenames: false
        types: [python]
      - id: ruff-format
        name: Ruff format (Pixi lock)
        entry: pixi run --locked format:check
        language: system
        pass_filenames: false
        types: [python]
      - id: ty-check
        name: Type checking (informational, manual)
        entry: pixi run --locked typecheck
        language: system
        pass_filenames: false
        stages: [manual]
      - id: commitizen
        name: Conventional commit message
        entry: pixi run --locked cz check --commit-msg-file
        language: system
        stages: [commit-msg]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.22.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
        args: [--unsafe]
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-ast
exclude: ^(pixi\.lock|web/frontend/package-lock\.json)$
