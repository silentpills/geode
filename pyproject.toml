[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "geode-gnss"
dynamic = ["version"]
description = "A Python wrapper to parallelize GAMIT executions"
license = { file = "LICENSE" }
readme = "README.md"
authors = [
  { name = "Demián D. Gómez", email = "demiang@gmail.com"},
]
maintainers = [
  { name = "Demián D. Gómez", email = "demiang@gmail.com"},
  { name = "Shane Grigsby (espg)", email = "refuge@rocktalus.com" },
]
keywords = ["GNSS", "GAMIT", "geodesy", "GPS", "parallel processing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0.0",
    "numpy>=1.26.4",
    "pandas",
    "tqdm>=4.66.5",
    "dispy",
    "legacy-cgi; python_version >= '3.13'",
    "psycopg[binary]>=3.1.8",
    "pycos",
    "country-converter",
    "charset-normalizer>=3.4.4",
    "earthscope-cli>=0.8.2",
    "earthscope-sdk>=0.2.0",
    "cartopy>=0.22.0",
    "cryptography>=44.0.1",
    "dirsync>=2.2.4",
    "geopy>=2.4.1",
    #h5py==3.4.0
    #hdf5storage>=0.1.18
    "usgs-libcomcat",
    "matplotlib>=2.0.0",
    "munch>=2.5.0",
    "networkx",
    "paramiko>=3.4.0",
    "psutil>=5.6.3",
    "requests>=2.32.4",
    "scikit-learn>=1.1",
    "scipy>=1.2.0",
    "simplekml>=1.3.6",
    "xmltodict>=0.13.0",
    "scikit-image",
    "shapely",
    "obspy",
    "geopandas"
]

[project.scripts]
"PlotETM.py" = "com.PlotETM:main"
"AlterETM.py" = "com.AlterETM:main"
"EtmStacker.py" = "com.EtmStacker:main"
"ScanArchive.py" = "com.ScanArchive:main"
"ArchiveService.py" = "com.ArchiveService:main"
"DownloadSources.py" = "com.DownloadSources:main"
"LocateRinex.py" = "com.LocateRinex:main"
"StationReport.py" = "com.StationReport:main"
"StationKmz.py" = "com.StationKmz:main"
"CampaignPlanner.py" = "com.CampaignPlanner:main"

[project.optional-dependencies]
reports = ["pillow>=9.0", "staticmap>=0.5.7", "weasyprint>=60.0"]

[project.urls]
"Homepage" = "https://github.com/demiangomez/geode"
"Bug Tracker" = "https://github.com/demiangomez/geode/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["geode*", "com*"]

[tool.setuptools.package-data]
"geode.elasticity" = ["data/*"]
"geode.etm.visualization" = ["*.png"]
"geode.reports" = ["*.png", "flags/*.svg"]

[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --ignore=web --ignore=docs_legacy"
testpaths = [
    "geode/tests",
]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.0.0"  # Managed by setuptools-scm
tag_format = "v$version"
version_scheme = "semver"
version_provider = "scm"
update_changelog_on_bump = true
major_version_zero = true


[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort (import sorting)
    "S",    # flake8-bandit (security)
    # Future: enable these as legacy code is cleaned up
    # "UP",   # pyupgrade
    # "B",    # flake8-bugbear
    # "SIM",  # flake8-simplify
]
ignore = [
    # Formatting (handled by ruff format)
    "E501",   # Line too long
    "W291",   # Trailing whitespace (in strings/comments formatter can't fix)
    "W293",   # Blank line contains whitespace (same as above)
    # Legacy code patterns (to be addressed incrementally)
    "E402",   # Module import not at top of file
    "E711",   # Comparison to None (== None vs is None)
    "E712",   # Comparison to True/False
    "E722",   # Bare except
    "E731",   # Lambda assignment
    "E741",   # Ambiguous variable name
    "F402",   # Import shadowed by loop variable
    "F811",   # Redefined while unused
    "F841",   # Local variable assigned but never used
    # Security (intentional patterns in GNSS/scientific computing)
    "S101",   # Assert statements (invariant checking)
    "S105",   # Hardcoded password string
    "S301",   # Pickle usage (session save/restore)
    "S108",   # Hardcoded temp file paths
    "S110",   # Try-except-pass
    "S307",   # Suspicious eval usage
    "S311",   # Non-cryptographic random (clustering seeds)
    "S314",   # Suspicious XML usage
    "S321",   # FTP usage (GNSS data distribution)
    "S324",   # Insecure hash function
    "S506",   # Unsafe YAML load
    "S603",   # Subprocess without shell check
    "S604",   # Call with shell=True
    "S605",   # Start process with a shell
    "S607",   # Start process with partial path
    "S608",   # Hardcoded SQL expressions
]

[tool.ruff.format]
quote-style = "double"

[tool.ty.src]
include = ["geode", "com"]
exclude = [
  "web",
  "docs",
  "docs_legacy",
  ".pixi",
  ".pytest_cache",
  ".mypy_cache",
]

[tool.ty.environment]
python-version = "3.10"
